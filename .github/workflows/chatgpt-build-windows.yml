name: Build CemuExtend Windows x64

on:
  push:
    branches:
      - chatgpt-build-windows

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Windows x64 with the project's documented Docker toolchain
        env:
          CEMU_FRONTEND: wx
          CEMU_OVERLAY_BACKEND: imgui
        run: |
          ./docker-build.sh win

      - name: Prepare runtime files
        run: |
          mkdir -p result/bin
          cp -a bin/resources result/bin/
          cp -a bin/gameProfiles result/bin/
          if [ -f dist/network_services.xml ]; then
            cp dist/network_services.xml result/bin/
          fi
          test -s result/bin/Cemu_release.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: CemuExtend-Windows-x64
          path: result/bin/
          if-no-files-found: error
          retention-days: 7
